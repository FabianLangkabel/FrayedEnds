# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test Basic Functionality

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.12']
        os: [ubuntu-24.04]
        include:
          - os: ubuntu-24.04
            cxx: /usr/bin/g++-13

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install prerequisites Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build g++-13 libblis4-serial liblapack-dev liblapack3 libboost-dev libboost-serialization-dev libeigen3-dev

      - name: Install basic python dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Test basic MADNESS installation
        run: |
          git clone https://github.com/m-a-d-n-e-s-s/madness madness_source
          mkdir madness_build
          export MADNESS_DIR=$(realpath madness)
          echo "Madness Dir:"
          echo $MADNESS_DIR
          echo "test"
          echo $(realpath madness)
          cmake -D CMAKE_INSTALL_PREFIX=$MADNESS_DIR -DENABLE_MPI=OFF -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG" -S madness_source -B madness_build
          make -C madness_build -j4
          sudo cmake --build madness_build/ --target install -j4

          MADNESS_DIR=$MADNESS_DIR pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          cd tests
          pytest test_basics.py
          pytest test_methods.py
          pytest test_methods_fc.py
          pytest test_pyscf.py
