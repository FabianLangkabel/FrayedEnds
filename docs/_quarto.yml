project:
  type: website
  output-dir: _site

website:
  title: "FrayedEnds"
  description: "Basis-Set-Free Quantum Chemistry"
  image: frayed_ends.png
  repo-url: https://github.com/FabianLangkabel/FrayedEnds/
  repo-branch: main
  repo-subdir: docs
  repo-actions: [source, issue]
  navbar:
    logo: frayedends_light.png
    right:
      - text: "Home"
        file: index.qmd
      - text: "Tutorials"
        file: tutorials.qmd
      - text: "Contribution"
        file: contribution.ipynb

  favicon: favicon.ico
  open-graph: true
  google-analytics: G-V7DRP5E70N
  cookie-consent:
      type: express
      style: simple

format:
  html:
    theme:
      light: [flatly, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css

execute:
  freeze: auto

